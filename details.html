<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="tim-dashia-site-build" content="v29-details">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Details · Tim & Dashia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Cormorant+Garamond:wght@400;500;600&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--cream:#efe4d3;--paper:#f7efe4;--ink:#3a2b22;--green:#6b1f2a;--maroon:#6b1f2a;--type:"Courier Prime","Courier New",monospace;--serif:"Cormorant Garamond",serif;--script:"Caveat",cursive}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(180deg,#f8f0e4,#efe4d3);color:var(--ink);padding:24px}
.card{width:min(720px,94vw);padding:54px 32px;text-align:center;background:rgba(247,239,228,.9);border:1px solid rgba(58,43,34,.14);box-shadow:0 20px 60px rgba(62,42,27,.12)}
.kicker{font:700 11px var(--type);letter-spacing:.13em;text-transform:uppercase}
h1{font:500 clamp(58px,9vw,92px)/.9 var(--serif);margin:10px 0}
.script{font:500 37px var(--script);color:var(--green)}
p{font:400 15px/1.7 var(--type);margin:20px auto;max-width:520px}
a{display:inline-block;margin-top:15px;padding:12px 18px;background:var(--green);color:#fff;text-decoration:none;font:700 10px var(--type);letter-spacing:.1em;text-transform:uppercase}
</style>

<style id="v25-maroon-buttons">
/* v25 — cohesive maroon buttons across the wedding site */
button,
input[type="button"],
input[type="submit"],
input[type="reset"],
.outline-button,
.btn,
.solid-button,
.primary,
.small-btn,
.ghost,
.danger,
.light,
.redbtn,
.admin-button,
.editor-button,
.editor-tools button,
.confirm-link button,
.registration-success-link button,
.registration-success-actions button,
.rule-editor-actions button,
.score-protection-actions button {
  background:#6b1f2a !important;
  color:#fff !important;
  border-color:#6b1f2a !important;
}
button:hover,
input[type="button"]:hover,
input[type="submit"]:hover,
input[type="reset"]:hover,
.outline-button:hover,
.btn:hover,
.solid-button:hover,
.primary:hover,
.small-btn:hover,
.ghost:hover,
.danger:hover,
.light:hover,
.redbtn:hover,
.admin-button:hover,
.editor-button:hover,
.editor-tools button:hover {
  background:#4f1720 !important;
  color:#fff !important;
  border-color:#4f1720 !important;
}
button:disabled,
input[type="button"]:disabled,
input[type="submit"]:disabled {
  opacity:.55 !important;
  cursor:not-allowed !important;
}
</style>


<style id="v29-construction-doodles">
:root{--construction-yellow:#f2d66f;--construction-ink:#2f2924}
.construction-tape-mark{
  position:absolute;z-index:8;height:30px;width:170px;pointer-events:none;
  border-top:2px solid var(--construction-ink);border-bottom:2px solid var(--construction-ink);
  background:repeating-linear-gradient(135deg,var(--construction-yellow) 0 20px,transparent 20px 40px);
  filter:drop-shadow(0 3px 2px rgba(58,43,34,.08));
}
.construction-cone-mark{position:absolute;z-index:8;width:62px;height:auto;pointer-events:none;overflow:visible}
.construction-cone-mark .cone-line{fill:none;stroke:var(--construction-ink);stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
.construction-cone-mark .cone-fill{fill:var(--construction-yellow);stroke:var(--construction-ink);stroke-width:3.2;stroke-linejoin:round}
.construction-cone-mark .cone-clear{fill:transparent;stroke:var(--construction-ink);stroke-width:3.2;stroke-linejoin:round}
@media(max-width:600px){.construction-tape-mark{width:125px;height:24px}.construction-cone-mark{width:48px}}
</style>


<style id="v29-details-admin-workview">
.card{position:relative;overflow:visible}
.details-admin-construction{display:none}
body.details-admin-mode .details-admin-construction{display:block}
.details-work-tape-1{top:-18px;left:-36px;transform:rotate(-7deg)}
.details-work-tape-2{bottom:26px;right:-45px;transform:rotate(6deg);width:220px}
.details-work-cone{right:10px;top:18px;transform:rotate(8deg)}
.details-admin-note{display:none;margin:22px auto 0;max-width:560px;padding:13px 16px;border:2px dashed #2f2924;background:rgba(242,214,111,.28);font:700 11px/1.5 var(--type);letter-spacing:.05em}
body.details-admin-mode .details-admin-note{display:block}
.details-admin-toggle{position:fixed;right:18px;bottom:18px;z-index:30;border:1px solid var(--maroon);background:var(--maroon);color:#fff;padding:10px 14px;font:700 10px var(--type);letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
</style>

</head>
<body>
<div class="card">
  <div class="details-admin-construction"><div class="construction-tape-mark details-work-tape-1"></div><div class="construction-tape-mark details-work-tape-2"></div><svg class="construction-cone-mark details-work-cone" viewBox="0 0 72 92" aria-hidden="true">
  <path class="cone-clear" d="M27 8h18l7 20H20L27 8Z"/>
  <path class="cone-fill" d="M20 28h32l8 24H12l8-24Z"/>
  <path class="cone-clear" d="M12 52h48l8 24H4l8-24Z"/>
  <path class="cone-line" d="M3 76h66l-5 9H8l-5-9Z"/>
  <path class="cone-line" d="M31 14h10M18 38h36M11 62h50"/>
</svg></div>
  <div class="kicker">Tim & Dashia</div>
  <h1>Details</h1>
  <div class="script">Coming soon ♡</div>
  <p>This page is intentionally blank for now while we get the main cover page exactly right.</p>
  <a href="index.html">← Back Home</a>
  <div class="details-admin-note">ADMIN REMINDER: this page still needs the backend flow for automated guest emails, the Amazon/registry link, and final wedding details.</div>
</div>
<button class="details-admin-toggle" id="detailsAdminToggle" type="button">Admin Work View</button>
<script>
const DETAILS_ADMIN_HASH="18642fa8fb69ca94183ef39f93692a597872125a8b7d607afab643dfd89569a8";
async function detailsSha256(value){const data=new TextEncoder().encode(value);const digest=await crypto.subtle.digest("SHA-256",data);return [...new Uint8Array(digest)].map(b=>b.toString(16).padStart(2,"0")).join("");}
document.getElementById("detailsAdminToggle")?.addEventListener("click",async()=>{
  if(document.body.classList.contains("details-admin-mode")){document.body.classList.remove("details-admin-mode");return;}
  const code=prompt("Enter the Admin code to show unfinished Details work:"); if(code===null)return;
  if(await detailsSha256(code)!==DETAILS_ADMIN_HASH){alert("Incorrect admin code.");return;}
  document.body.classList.add("details-admin-mode");
});
</script>
</body>
</html>
