<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="tim-dashia-site-build" content="v25-details">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Details · Tim & Dashia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Cormorant+Garamond:wght@400;500;600&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--cream:#efe4d3;--paper:#f7efe4;--ink:#3a2b22;--green:#6b1f2a;--maroon:#6b1f2a;--type:"Courier Prime","Courier New",monospace;--serif:"Cormorant Garamond",serif;--script:"Caveat",cursive}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(180deg,#f8f0e4,#efe4d3);color:var(--ink);padding:24px}
.card{width:min(720px,94vw);padding:54px 32px;text-align:center;background:rgba(247,239,228,.9);border:1px solid rgba(58,43,34,.14);box-shadow:0 20px 60px rgba(62,42,27,.12)}
.kicker{font:700 11px var(--type);letter-spacing:.13em;text-transform:uppercase}
h1{font:500 clamp(58px,9vw,92px)/.9 var(--serif);margin:10px 0}
.script{font:500 37px var(--script);color:var(--green)}
p{font:400 15px/1.7 var(--type);margin:20px auto;max-width:520px}
a{display:inline-block;margin-top:15px;padding:12px 18px;background:var(--green);color:#fff;text-decoration:none;font:700 10px var(--type);letter-spacing:.1em;text-transform:uppercase}
</style>

<style id="v25-maroon-buttons">
/* v25 — cohesive maroon buttons across the wedding site */
button,
input[type="button"],
input[type="submit"],
input[type="reset"],
.btn,
.solid-button,
.primary,
.small-btn,
.ghost,
.danger,
.light,
.redbtn,
.admin-button,
.editor-button,
.editor-tools button,
.confirm-link button,
.registration-success-link button,
.registration-success-actions button,
.rule-editor-actions button,
.score-protection-actions button {
  background:#6b1f2a !important;
  color:#fff !important;
  border-color:#6b1f2a !important;
}
button:hover,
input[type="button"]:hover,
input[type="submit"]:hover,
input[type="reset"]:hover,
.btn:hover,
.solid-button:hover,
.primary:hover,
.small-btn:hover,
.ghost:hover,
.danger:hover,
.light:hover,
.redbtn:hover,
.admin-button:hover,
.editor-button:hover,
.editor-tools button:hover {
  background:#4f1720 !important;
  color:#fff !important;
  border-color:#4f1720 !important;
}
button:disabled,
input[type="button"]:disabled,
input[type="submit"]:disabled {
  opacity:.55 !important;
  cursor:not-allowed !important;
}
</style>

</head>
<body>
<div class="card">
  <div class="kicker">Tim & Dashia</div>
  <h1>Details</h1>
  <div class="script">Coming soon ♡</div>
  <p>This page is intentionally blank for now while we get the main cover page exactly right.</p>
  <a href="index.html">← Back Home</a>
</div>
</body>
</html>
