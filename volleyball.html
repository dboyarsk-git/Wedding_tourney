<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Volleyball Tournament · Tim & Dashia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Cormorant+Garamond:wght@400;500;600&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#efe4d3;--ink:#3a2b22;--green:#6b1f2a;--maroon:#6b1f2a;
  --type:"Courier Prime","Courier New",monospace;--serif:"Cormorant Garamond",serif;--script:"Caveat",cursive
}
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;
  background:linear-gradient(180deg,#f8f0e4,#efe4d3);color:var(--ink)
}
.card{
  width:min(720px,94vw);padding:56px 34px;text-align:center;
  background:rgba(247,239,228,.92);border:1px solid rgba(58,43,34,.14);
  box-shadow:0 20px 60px rgba(62,42,27,.12)
}
.kicker{font:700 11px var(--type);letter-spacing:.13em;text-transform:uppercase}
h1{font:500 clamp(58px,9vw,92px)/.9 var(--serif);margin:10px 0}
.script{font:500 38px var(--script);color:var(--green)}
p{font:400 15px/1.7 var(--type);margin:20px auto;max-width:520px}
a{
  display:inline-block;margin-top:15px;padding:12px 18px;background:var(--green);color:#fff;
  text-decoration:none;font:700 10px var(--type);letter-spacing:.1em;text-transform:uppercase
}
</style>
</head>
<body>
  <div class="card">
    <div class="kicker">Tim & Dashia</div>
    <h1>Volleyball Tournament</h1>
    <div class="script">Coming later ♡</div>
    <p>We are intentionally not building the volleyball page yet. Right now we are only perfecting the main cover page.</p>
    <a href="index.html">← Back Home</a>
  </div>
</body>
</html>
